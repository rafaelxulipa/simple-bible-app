<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
<defs>
  <linearGradient id="nightSky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#02020f"/>
    <stop offset=".45" stop-color="#0a0a34"/>
    <stop offset="1" stop-color="#131c4e"/>
  </linearGradient>
  <radialGradient id="moonGlow"><stop stop-color="#FFF8E0" stop-opacity=".3"/><stop offset=".4" stop-color="#FFF3C4" stop-opacity=".12"/><stop offset="1" stop-color="#FFF3C4" stop-opacity="0"/></radialGradient>
  <radialGradient id="moonSurface" cx=".35" cy=".3" r=".75"><stop stop-color="#FFFFF2"/><stop offset=".55" stop-color="#FDF6D8"/><stop offset="1" stop-color="#E7DBA4"/></radialGradient>
  <linearGradient id="nightCloud" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#4A4E86" stop-opacity=".5"/><stop offset="1" stop-color="#20244a" stop-opacity=".32"/></linearGradient>
  <filter id="nblur40"><feGaussianBlur stdDeviation="40"/></filter>
  <filter id="nblur14"><feGaussianBlur stdDeviation="14"/></filter>
</defs>

<rect width="1920" height="1080" fill="url(#nightSky)"/>

<!-- soft aurora -->
<ellipse cx="480" cy="100" rx="420" ry="260" fill="#6366F1" opacity=".07" filter="url(#nblur40)"/>
<ellipse cx="1520" cy="60" rx="380" ry="220" fill="#8B5CF6" opacity=".06" filter="url(#nblur40)"/>

<!-- stars -->
<g fill="#FFFFFF">
  <circle cx="80"   cy="90"  r="2.2" opacity=".5"/>
  <circle cx="190"  cy="160" r="1.6" opacity=".38"/>
  <circle cx="300"  cy="70"  r="2.6" opacity=".55"/>
  <circle cx="410"  cy="190" r="1.6" opacity=".42"/>
  <circle cx="520"  cy="110" r="2"   opacity=".48"/>
  <circle cx="630"  cy="60"  r="2.8" opacity=".6"/>
  <circle cx="710"  cy="200" r="1.6" opacity=".4"/>
  <circle cx="820"  cy="130" r="2"   opacity=".46"/>
  <circle cx="930"  cy="50"  r="2.4" opacity=".52"/>
  <circle cx="1020" cy="170" r="1.6" opacity=".38"/>
  <circle cx="1350" cy="90"  r="2.2" opacity=".5"/>
  <circle cx="1450" cy="150" r="1.8" opacity=".4"/>
  <circle cx="1550" cy="70"  r="2.6" opacity=".55"/>
  <circle cx="1640" cy="200" r="1.6" opacity=".4"/>
  <circle cx="1730" cy="110" r="2"   opacity=".48"/>
  <circle cx="1830" cy="60"  r="2.8" opacity=".6"/>
  <circle cx="120"  cy="330" r="2"   opacity=".42"/>
  <circle cx="260"  cy="400" r="1.6" opacity=".36"/>
  <circle cx="620"  cy="350" r="2.2" opacity=".46"/>
  <circle cx="1080" cy="320" r="1.6" opacity=".38"/>
  <circle cx="1250" cy="380" r="2"   opacity=".44"/>
  <circle cx="1780" cy="340" r="1.8" opacity=".4"/>
  <circle cx="90"   cy="520" r="1.6" opacity=".32"/>
  <circle cx="1900" cy="480" r="2"   opacity=".4"/>
  <circle cx="1000" cy="480" r="1.6" opacity=".32"/>
  <circle cx="450"  cy="550" r="1.6" opacity=".3"/>
  <circle cx="1500" cy="560" r="1.8" opacity=".34"/>
</g>

<!-- moon -->
<circle cx="1180" cy="220" r="120" fill="url(#moonGlow)" filter="url(#nblur40)"/>
<circle cx="1180" cy="220" r="78" fill="url(#moonGlow)"/>
<circle cx="1180" cy="220" r="42" fill="url(#moonSurface)"/>
<g fill="#D8CB92" opacity=".22">
  <circle cx="1162" cy="202" r="9"/>
  <circle cx="1198" cy="196" r="6"/>
  <circle cx="1202" cy="236" r="10"/>
  <circle cx="1168" cy="244" r="5"/>
</g>

<!-- clouds -->
<g fill="url(#nightCloud)" filter="url(#nblur14)" opacity=".75">
  <ellipse cx="260" cy="300" rx="170" ry="50"/>
  <ellipse cx="370" cy="280" rx="130" ry="60"/>
  <ellipse cx="480" cy="310" rx="160" ry="48"/>
</g>
<g fill="url(#nightCloud)" filter="url(#nblur14)" opacity=".6">
  <ellipse cx="1560" cy="450" rx="190" ry="54"/>
  <ellipse cx="1670" cy="428" rx="150" ry="64"/>
</g>
<g fill="url(#nightCloud)" filter="url(#nblur14)" opacity=".45">
  <ellipse cx="800" cy="600" rx="180" ry="50"/>
  <ellipse cx="120" cy="680" rx="200" ry="55"/>
</g>
</svg>
